# Production on one server: Caddy (HTTPS) → web app, plus the worker, Postgres and Redis.
# Usage: cp .env.example .env (fill it in, set DOMAIN), then: docker compose -f docker-compose.prod.yml up -d --build
# Media should live in S3 or R2 (STORAGE_BACKEND=s3) on its own domain (MEDIA_PUBLIC_URL).
x-app: &app
  build: .
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/autoschedule
    REDIS_URL: redis://redis:6379
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_started }

services:
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/autoschedule
    command: ["node", "--import", "tsx", "src/db/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *app
    command: ["npx", "next", "start", "-H", "0.0.0.0"]
    expose: ["3000"]

  worker:
    <<: *app
    command: ["node", "--import", "tsx", "src/worker/index.ts"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN}", "--to", "web:3000"]
    volumes: [caddy:/data]
    depends_on: [web]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autoschedule
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

volumes:
  pgdata:
  redisdata:
  caddy:
